name: Tally
options:
  bundleIdPrefix: com.tally
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # 工程设置全部在本文件显式声明，不依赖 XcodeGen 安装目录旁的
  # setting_presets.yml。这样即使使用独立下载的 xcodegen 二进制，
  # 也不会静默丢失 DEBUG 条件、Release 优化或编译器告警设置。
  settingPresets: none
settings:
  base:
    PRODUCT_NAME: "$(TARGET_NAME)"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      ALWAYS_SEARCH_USER_PATHS: NO
      CLANG_ANALYZER_NONNULL: YES
      CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
      CLANG_CXX_LANGUAGE_STANDARD: "gnu++14"
      CLANG_CXX_LIBRARY: "libc++"
      CLANG_ENABLE_MODULES: YES
      CLANG_ENABLE_OBJC_ARC: YES
      CLANG_ENABLE_OBJC_WEAK: YES
      CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
      CLANG_WARN_BOOL_CONVERSION: YES
      CLANG_WARN_COMMA: YES
      CLANG_WARN_CONSTANT_CONVERSION: YES
      CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
      CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
      CLANG_WARN_DOCUMENTATION_COMMENTS: YES
      CLANG_WARN_EMPTY_BODY: YES
      CLANG_WARN_ENUM_CONVERSION: YES
      CLANG_WARN_INFINITE_RECURSION: YES
      CLANG_WARN_INT_CONVERSION: YES
      CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
      CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
      CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
      CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
      CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
      CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
      CLANG_WARN_STRICT_PROTOTYPES: YES
      CLANG_WARN_SUSPICIOUS_MOVE: YES
      CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
      CLANG_WARN_UNREACHABLE_CODE: YES
      CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
      COPY_PHASE_STRIP: NO
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_STRICT_OBJC_MSGSEND: YES
      ENABLE_TESTABILITY: YES
      GCC_C_LANGUAGE_STANDARD: gnu11
      GCC_DYNAMIC_NO_PIC: NO
      GCC_NO_COMMON_BLOCKS: YES
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS:
        - "$(inherited)"
        - DEBUG=1
      GCC_WARN_64_TO_32_BIT_CONVERSION: YES
      GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
      GCC_WARN_UNDECLARED_SELECTOR: YES
      GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
      GCC_WARN_UNUSED_FUNCTION: YES
      GCC_WARN_UNUSED_VARIABLE: YES
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      MTL_FAST_MATH: YES
      ONLY_ACTIVE_ARCH: YES
      SDKROOT: iphoneos
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      ALWAYS_SEARCH_USER_PATHS: NO
      CLANG_ANALYZER_NONNULL: YES
      CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
      CLANG_CXX_LANGUAGE_STANDARD: "gnu++14"
      CLANG_CXX_LIBRARY: "libc++"
      CLANG_ENABLE_MODULES: YES
      CLANG_ENABLE_OBJC_ARC: YES
      CLANG_ENABLE_OBJC_WEAK: YES
      CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
      CLANG_WARN_BOOL_CONVERSION: YES
      CLANG_WARN_COMMA: YES
      CLANG_WARN_CONSTANT_CONVERSION: YES
      CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
      CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
      CLANG_WARN_DOCUMENTATION_COMMENTS: YES
      CLANG_WARN_EMPTY_BODY: YES
      CLANG_WARN_ENUM_CONVERSION: YES
      CLANG_WARN_INFINITE_RECURSION: YES
      CLANG_WARN_INT_CONVERSION: YES
      CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
      CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
      CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
      CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
      CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
      CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
      CLANG_WARN_STRICT_PROTOTYPES: YES
      CLANG_WARN_SUSPICIOUS_MOVE: YES
      CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
      CLANG_WARN_UNREACHABLE_CODE: YES
      CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
      COPY_PHASE_STRIP: NO
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      ENABLE_NS_ASSERTIONS: NO
      ENABLE_STRICT_OBJC_MSGSEND: YES
      ENABLE_TESTABILITY: NO
      GCC_C_LANGUAGE_STANDARD: gnu11
      GCC_NO_COMMON_BLOCKS: YES
      GCC_WARN_64_TO_32_BIT_CONVERSION: YES
      GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
      GCC_WARN_UNDECLARED_SELECTOR: YES
      GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
      GCC_WARN_UNUSED_FUNCTION: YES
      GCC_WARN_UNUSED_VARIABLE: YES
      MTL_ENABLE_DEBUG_INFO: NO
      MTL_FAST_MATH: YES
      SDKROOT: iphoneos
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  Tally:
    type: application
    platform: iOS
    sources:
      - Tally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tally.logan
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "iPhone Developer"
        # 与已提交的 Tally.xcodeproj 同步（Xcode 里手工设置过）：重新 xcodegen generate
        # 时不要丢掉 Team，否则真机安装 / Archive 会因缺少签名配置而失败
        DEVELOPMENT_TEAM: XN5LYQCCY2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # API 地址由构建配置注入：Debug 允许本地 HTTP，Release 必须显式注入真实 HTTPS 域名。
        # Release 故意【不设默认值】：任何示例域或占位域名
        # 都可能被误打进产物，因此无有效 URL 时 preBuild 校验会让构建直接失败。
        Debug:
          TALLY_API_BASE_URL: http://localhost:8080
        Release:
          TALLY_API_BASE_URL: ""
    preBuildScripts:
      - name: "校验 API 地址（Release 禁止 localhost/示例域/占位域名）"
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          if [ "${CONFIGURATION:-}" = "Release" ]; then
            bash "${SRCROOT}/scripts/validate-api-url.sh" --url "${TALLY_API_BASE_URL:-}" --require-https
          else
            echo "note: ${CONFIGURATION:-Debug} 构建跳过 Release 域名校验（TALLY_API_BASE_URL=${TALLY_API_BASE_URL:-<未设置>}）"
          fi
    info:
      path: Tally/Support/Info.plist
      properties:
        CFBundleDisplayName: Tally
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        # 由构建配置（TALLY_API_BASE_URL）注入，避免源码/Info.plist 写死地址
        TallyAPIBaseURL: $(TALLY_API_BASE_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPhone 保持竖屏；通用 App 在 iPad 上声明完整方向集，满足多任务窗口要求，
        # 避免 Archive 阶段的 “All interface orientations must be supported” 告警。
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 生产用 HTTPS 不再全局放行任意 HTTP；仅允许本地/局域网 HTTP 便于开发联调
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  TallyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TallyTests
    dependencies:
      - target: Tally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tally.logan.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tally.app/Tally"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Tally:
    build:
      targets:
        Tally: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: TallyTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
