name: Tally
options:
  bundleIdPrefix: com.tally
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Tally:
    type: application
    platform: iOS
    sources:
      - Tally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tally.logan
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
      configs:
        # API 地址由构建配置注入：Debug 允许本地 HTTP，Release 必须是 HTTPS 生产域名
        Debug:
          TALLY_API_BASE_URL: http://localhost:8080
        Release:
          TALLY_API_BASE_URL: https://your-production-domain.example.com
    info:
      path: Tally/Support/Info.plist
      properties:
        CFBundleDisplayName: Tally
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # 由构建配置（TALLY_API_BASE_URL）注入，避免源码/Info.plist 写死地址
        TallyAPIBaseURL: $(TALLY_API_BASE_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 生产用 HTTPS 不再全局放行任意 HTTP；仅允许本地/局域网 HTTP 便于开发联调
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
