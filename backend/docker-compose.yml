services:
  tally-backend:
    build: .
    container_name: tally-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATABASE_URL: "./data/tally.db"
      # 生产环境务必通过环境变量或 .env 传入强随机密钥
      JWT_SECRET: "${JWT_SECRET:-please-change-me-to-a-long-random-string}"
      # 业务时区：与账本日期口径一致（“今天/当月”判断）
      TZ: "Asia/Shanghai"
      APP_TIMEZONE: "Asia/Shanghai"
    volumes:
      - tally-data:/app/data

volumes:
  tally-data:
