openapi: 3.0.3
info:
  title: Tally API
  version: 0.1.0
  description: 家庭记账后端契约。金额统一为整数（分），日期为 YYYY-MM-DD，时间为 ISO-8601。
servers:
  - url: https://api.example.com
    description: 生产（HTTPS，实际域名由部署方替换；开发期可用本地 HTTPS 或局域网）
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: accounts
  - name: categories
  - name: transactions
  - name: budgets
  - name: recurring
  - name: stats
  - name: families
  - name: loans
  - name: imports
  - name: audit
paths:
  /health:
    get:
      tags: [audit]
      summary: 基础健康检查
      operationId: health
      responses:
        "200":
          description: OK
          headers:
            x-request-id:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /health/live:
    get:
      tags: [audit]
      summary: 存活探针（仅进程）
      operationId: healthLive
      responses:
        "200": { description: OK }
  /health/ready:
    get:
      tags: [audit]
      summary: 就绪探针（数据库+迁移）
      operationId: healthReady
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  migrationsApplied: { type: integer }
  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: 注册成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: 新令牌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
  /api/v1/auth/request-code:
    post:
      tags: [auth]
      operationId: requestCode
      summary: 发送短信验证码（开发模式回传 code，生产不返回）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "200":
          description: 已发送
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  code: { type: string, nullable: true }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login-code:
    post:
      tags: [auth]
      operationId: loginWithCode
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string }
                code: { type: string }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
  /api/v1/auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: 申请密码重置（生产模式不回传 resetToken，仅返回 ok）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "200":
          description: 已受理。开发模式回传 resetToken，生产模式不返回。
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  resetToken: { type: string, nullable: true, description: 仅开发模式回传；生产环境恒为缺省 }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [resetToken, newPassword]
              properties:
                resetToken: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200":
          description: 重置成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      parameters:
        - { name: ledgerId, in: query, schema: { type: string }, required: false }
      responses:
        "200":
          description: 账户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
    post:
      tags: [accounts]
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, type, currency, initialBalance]
              properties:
                name: { type: string }
                type: { type: string, enum: [cash, bank, wallet, investment, credit_card, credit, loan, other] }
                currency: { type: string }
                initialBalance: { type: integer }
                ledgerId: { type: string }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/Account" }
  /api/v1/categories:
    get:
      tags: [categories]
      operationId: listCategories
      parameters:
        - { name: ledgerId, in: query, schema: { type: string }, required: false }
      responses:
        "200":
          description: 分类列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
  /api/v1/transactions:
    get:
      tags: [transactions]
      operationId: listTransactions
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, required: false }
        - { name: to, in: query, schema: { type: string, format: date }, required: false }
        - { name: accountId, in: query, schema: { type: string }, required: false }
        - { name: ledgerId, in: query, schema: { type: string }, required: false }
      responses:
        "200":
          description: 流水列表（含 total/page/limit）
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Transaction" }
    post:
      tags: [transactions]
      operationId: createTransaction
      description: 收入/支出/转账（transfer 需 transferToAccountId）
  /api/v1/transactions/import:
    post:
      tags: [imports]
      operationId: importTransactionsLegacy
      deprecated: true
      description: 旧直接导入（建议改用 /imports/jobs）
  /api/v1/imports/jobs:
    post:
      tags: [imports]
      operationId: createImportJob
      description: 暂存导入：解析+去重判定，不直接写流水
      responses:
        "200":
          description: 已创建暂存任务
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/ImportJob" }
    get:
      tags: [imports]
      operationId: listImportJobs
      responses:
        "200":
          description: 任务列表
  /api/v1/imports/jobs/upload:
    post:
      tags: [imports]
      operationId: uploadImportFile
      summary: multipart 上传账单文件（txt/csv/xlsx/pdf，≤20MB）
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [source, file]
              properties:
                source: { type: string, enum: [wechat, alipay, bank] }
                file: { type: string, format: binary }
      responses:
        "200": { description: 已创建暂存任务 }
  /api/v1/imports/jobs/{id}:
    get:
      tags: [imports]
      operationId: getImportJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 任务详情+明细
  /api/v1/imports/items/{itemId}:
    patch:
      tags: [imports]
      operationId: decideImportItem
      summary: 逐条 accept/skip
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
  /api/v1/imports/jobs/{id}/commit:
    post:
      tags: [imports]
      operationId: commitImportJob
      summary: 批量提交 accept 明细为正式流水（事务化）
      responses:
        "200":
          description: 提交成功
  /api/v1/ledgers:
    get:
      tags: [families]
      operationId: listLedgers
  /api/v1/ledgers/switch:
    post:
      tags: [families]
      operationId: switchLedger
  /api/v1/families:
    get:
      tags: [families]
      operationId: listFamilies
    post:
      tags: [families]
      operationId: createFamily
  /api/v1/families/{id}/members:
    post:
      tags: [families]
      operationId: addFamilyMember
  /api/v1/families/{id}/members/{memberUserId}:
    delete:
      tags: [families]
      operationId: removeFamilyMember
  /api/v1/families/{id}/invitations:
    post:
      tags: [families]
      operationId: createFamilyInvitation
    get:
      tags: [families]
      operationId: listFamilyInvitations
  /api/v1/families/{id}/invitations/{inviteId}:
    delete:
      tags: [families]
      operationId: revokeFamilyInvitation
  /api/v1/families/invitations/{token}/accept:
    post:
      tags: [families]
      operationId: acceptFamilyInvitation
  /api/v1/families/invitations/{token}/decline:
    post:
      tags: [families]
      operationId: declineFamilyInvitation
  /api/v1/families/{id}/members/{memberUserId}:
    patch:
      tags: [families]
      operationId: changeFamilyMemberRole
  /api/v1/families/{id}/exit:
    post:
      tags: [families]
      operationId: exitFamily
  /api/v1/families/{id}/transfer:
    post:
      tags: [families]
      operationId: transferFamilyOwnership
  /api/v1/families/{id}:
    delete:
      tags: [families]
      operationId: deleteFamily
    patch:
      tags: [families]
      operationId: updateFamily
  /api/v1/liabilities:
    get:
      tags: [loans]
      operationId: getLiabilities
  /api/v1/loans:
    get:
      tags: [loans]
      operationId: listLoans
      responses:
        "200":
          description: 贷款列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Loan" } }
    post:
      tags: [loans]
      operationId: createLoan
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, type, principal, termMonths, startDate]
              properties:
                name: { type: string }
                type: { type: string, enum: [car, mortgage, other] }
                currency: { type: string, default: CNY }
                principal: { type: integer }
                annualRate: { type: number }
                termMonths: { type: integer }
                startDate: { type: string, format: date }
                accountId: { type: string, description: 还款来源账户 }
                liabilityAccountId: { type: string, description: 已有 loan 类型负债账户（缺省自动创建） }
                ledgerId: { type: string }
      responses:
        "200":
          description: 创建成功（自动创建或绑定 loan 负债账户）
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/Loan" }
  /api/v1/loans/{id}:
    get:
      tags: [loans]
      operationId: getLoan
      responses:
        "200":
          description: 贷款详情 + 还款计划
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/Loan" }
                  schedule: { type: array, items: { $ref: "#/components/schemas/LoanPayment" } }
  /api/v1/loans/{id}/pay:
    post:
      tags: [loans]
      operationId: payLoan
      description: |
        贷款还款：以 (actor_user_id, loan_id, idempotency_key) 唯一索引做数据库级幂等。
        - 偿还下一期（不传 installmentId）必须提供 idempotencyKey，否则 400 IDEMPOTENCY_KEY_REQUIRED；
        - 显式还款应传 installmentId（避免不同 key 双击连续偿还下一期）；
        - 同一 key + 相同请求：第二次起返回完全相同结果且 replayed=true；
        - 同一 key + 不同期次/账户/日期：409 IDEMPOTENCY_KEY_REUSED。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payFromAccountId: { type: string }
                date: { type: string, format: date, description: 还款日期（缺省用当期到期日） }
                ledgerId: { type: string }
                installmentId: { type: string, description: 显式还款期次；显式还款应传此字段 }
                idempotencyKey: { type: string, maxLength: 64, description: 幂等键；偿还下一期必填（1-64 字符） }
      responses:
        "200":
          description: 还款成功：本金转账 + 利息支出两条流水，共用 paymentGroupId（重放时 replayed=true 且结果与首次一致）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  replayed: { type: boolean, description: 是否命中幂等重放 }
                  paidDate: { type: string, format: date }
                  installment: { type: integer }
                  installmentId: { type: string }
                  principalTransactionId: { type: string }
                  interestTransactionId: { type: string }
                  paymentGroupId: { type: string }
        "400":
          description: 偿还下一期未提供 idempotencyKey → IDEMPOTENCY_KEY_REQUIRED；贷款已还清 → LOAN_PAID_OFF
        "409":
          description: 该期已还款 → INSTALLMENT_ALREADY_PAID；同一 key 复用为不同请求 → IDEMPOTENCY_KEY_REUSED
  /api/v1/credit-cards/{accountId}/bills:
    post:
      tags: [loans]
      operationId: createCreditCardBill
  /api/v1/credit-card-bills:
    get:
      tags: [loans]
      operationId: listCreditCardBills
  /api/v1/credit-card-bills/{id}:
    patch:
      tags: [loans]
      operationId: markCreditCardBill
  /api/v1/credit-card-bills/{id}/pay:
    post:
      tags: [loans]
      operationId: payCreditCardBill
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [payFromAccountId]
              properties:
                payFromAccountId: { type: string }
                payDate: { type: string, format: date }
                ledgerId: { type: string }
      responses:
        "200":
          description: 还款成功并生成转账
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  transactionId: { type: string }
  /api/v1/audit-logs:
    get:
      tags: [audit]
      operationId: listAuditLogs
      summary: 账本内审计日志（可按 entityType/entityId 过滤）
      parameters:
        - { name: ledgerId, in: query, schema: { type: string }, required: false }
        - { name: entityType, in: query, schema: { type: string }, required: false }
        - { name: entityId, in: query, schema: { type: string }, required: false }
      responses:
        "200":
          description: 审计记录列表
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: 统一错误
      headers:
        x-request-id:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string }
        time: { type: string, format: date-time }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    AuthResponse:
      type: object
      required: [user, token, refreshToken]
      properties:
        user: { $ref: "#/components/schemas/User" }
        token: { type: string }
        refreshToken: { type: string }
    User:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string }
        createdAt: { type: string }
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string }
        password: { type: string }
        displayName: { type: string }
    Account:
      type: object
      required: [id, name, type, currency]
      properties:
        id: { type: string }
        ledgerId: { type: string, nullable: true }
        name: { type: string }
        type: { type: string }
        currency: { type: string }
        balance: { type: integer }
    Category:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [income, expense] }
        icon: { type: string, nullable: true }
        color: { type: string, nullable: true }
    Transaction:
      type: object
      required: [id, accountId, type, amount, currency, date]
      properties:
        id: { type: string }
        ledgerId: { type: string, nullable: true }
        accountId: { type: string }
        type: { type: string, enum: [income, expense, transfer] }
        amount: { type: integer }
        currency: { type: string }
        note: { type: string, nullable: true }
        date: { type: string, format: date }
        sourceType: { type: string, nullable: true }
        transferToAccountId: { type: string, nullable: true }
        paymentGroupId: { type: string, nullable: true, description: 一次还款拆分流水（本金+利息）的分组 ID }
    Loan:
      type: object
      required: [id, name, type, currency, principal, remainingPrincipal]
      properties:
        id: { type: string }
        ledgerId: { type: string, nullable: true }
        name: { type: string }
        type: { type: string, enum: [car, mortgage, other] }
        currency: { type: string }
        principal: { type: integer }
        annualRate: { type: number }
        termMonths: { type: integer }
        startDate: { type: string, format: date }
        monthlyPayment: { type: integer }
        remainingPrincipal: { type: integer }
        accountId: { type: string, nullable: true, description: 还款来源账户 }
        liabilityAccountId: { type: string, nullable: true, description: 贷款负债账户（type=loan） }
        status: { type: string, enum: [active, paid_off, closed] }
        nextPaymentDate: { type: string, format: date, nullable: true }
    LoanPayment:
      type: object
      required: [id, loanId, installmentNo, dueDate, principalDue, interestDue, total]
      properties:
        id: { type: string }
        loanId: { type: string }
        installmentNo: { type: integer }
        dueDate: { type: string, format: date }
        principalDue: { type: integer }
        interestDue: { type: integer }
        principalPaid: { type: integer }
        interestPaid: { type: integer }
        total: { type: integer }
        paid: { type: boolean }
        status: { type: string, enum: [pending, paid] }
    ImportJob:
      type: object
      required: [id, ledgerId, source, status]
      properties:
        id: { type: string }
        ledgerId: { type: string }
        source: { type: string }
        filename: { type: string, nullable: true }
        fileHash: { type: string, nullable: true }
        status: { type: string, enum: [staged, committed, failed] }
        totalCount: { type: integer }
        importedCount: { type: integer }
        skippedCount: { type: integer }
