openapi: 3.0.3
info:
  title: Tally API
  version: 0.1.0
  description: 家庭记账后端契约。金额统一为整数（分），日期为 YYYY-MM-DD，时间为 ISO-8601。
servers:
  - url: https://your-domain.cn
    description: 生产（正式生产唯一域名；HTTPS，由 Caddy 终结 TLS）
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: accounts
  - name: categories
  - name: transactions
  - name: budgets
  - name: recurring
  - name: stats
  - name: families
  - name: loans
  - name: imports
  - name: audit
paths:
  /health:
    get:
      tags: [audit]
      summary: 基础健康检查
      operationId: health
      responses:
        "200":
          description: OK
          headers:
            x-request-id:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /health/live:
    get:
      tags: [audit]
      summary: 存活探针（仅进程）
      operationId: healthLive
      responses:
        "200": { description: OK }
  /health/ready:
    get:
      tags: [audit]
      summary: 就绪探针（数据库+迁移）
      operationId: healthReady
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  migrationsApplied: { type: integer }
  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: 旧邮箱注册（已下线，统一 410 AUTH_METHOD_REMOVED）
      responses:
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 旧密码登录（已下线，统一 410 AUTH_METHOD_REMOVED）
      responses:
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: 新令牌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
  /api/v1/auth/request-code:
    post:
      tags: [auth]
      operationId: requestCode
      summary: 发送登录短信验证码（开发模式回传 code，生产不返回）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: 中国大陆 11 位手机号（允许 138… / +86138…） }
      responses:
        "200":
          description: 已发送
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  code: { type: string, nullable: true }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login-code:
    post:
      tags: [auth]
      operationId: loginWithCode
      summary: 验证码登录：完整账号直接登录；新账号或旧“用户”账号返回 nickname_required
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        "200":
          description: 判别联合（authenticated | nickname_required）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginCodeResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/complete-profile:
    post:
      tags: [auth]
      operationId: completeProfile
      summary: 完成强制昵称设置（新账号/旧“用户”账号），成功后返回会话
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [onboardingToken, nickname]
              properties:
                onboardingToken: { type: string, description: 一次性 onboarding 令牌（10 分钟） }
                nickname: { type: string, description: 2-20 个中文/字母/数字/_，非纯数字，非保留词 }
      responses:
        "200":
          description: 完成并登录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  # 无密码、无密码重置、无邮箱认证：本项目唯一认证通道是手机号 + 短信验证码（新账号强制唯一昵称）。
  # 旧的邮箱/密码 register / login / reset-code / reset-password 已整体下线，
  # 后端保留路由但统一返回 410 AUTH_METHOD_REMOVED（没有旧的“邮件找回/重置”语义）。
  /api/v1/auth/reset-code:
    post:
      tags: [auth]
      operationId: requestPasswordResetCode
      summary: 旧找回密码验证码（已下线，统一 410 AUTH_METHOD_REMOVED）
      responses:
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: 旧密码重置（已下线，统一 410 AUTH_METHOD_REMOVED）
      responses:
        "410": { $ref: "#/components/responses/Error" }

  /api/v1/users/me:
    get:
      tags: [auth]
      operationId: getMyProfile
      summary: 本人资料（手机号仅在本接口返回，含脱敏）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
  /api/v1/users/nickname-availability:
    get:
      tags: [auth]
      operationId: checkNicknameAvailability
      security: []
      parameters:
        - { name: nickname, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: 是否可用
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: { type: boolean }
                  reason: { type: string, nullable: true }
  /api/v1/users/me/nickname:
    patch:
      tags: [auth]
      operationId: changeNickname
      summary: 修改昵称（30 天冷却 + 全局判重 + 旧昵称保留 30 天）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      parameters:
        - { name: ledgerId, in: query, schema: { type: string }, required: false }
      responses:
        "200":
          description: 账户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
    post:
      tags: [accounts]
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, type, currency, initialBalance]
              properties:
                name: { type: string }
                type: { type: string, enum: [cash, bank, wallet, investment, credit_card, credit, loan, other] }
                currency: { type: string }
                initialBalance: { type: integer }
                ledgerId: { type: string }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/Account" }
  /api/v1/categories:
    get:
      tags: [categories]
      operationId: listCategories
      parameters:
        - { name: ledgerId, in: query, schema: { type: string }, required: false }
      responses:
        "200":
          description: 分类列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
  /api/v1/transactions:
    get:
      tags: [transactions]
      operationId: listTransactions
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, required: false }
        - { name: to, in: query, schema: { type: string, format: date }, required: false }
        - { name: accountId, in: query, schema: { type: string }, required: false }
        - { name: ledgerId, in: query, schema: { type: string }, required: false }
      responses:
        "200":
          description: 流水列表（含 total/page/limit）
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Transaction" }
    post:
      tags: [transactions]
      operationId: createTransaction
      description: 收入/支出/转账（transfer 需 transferToAccountId）
  /api/v1/transactions/import:
    post:
      tags: [imports]
      operationId: importTransactionsLegacy
      deprecated: true
      description: 旧直接导入（建议改用 /imports/jobs）
  /api/v1/imports/jobs:
    post:
      tags: [imports]
      operationId: createImportJob
      description: 暂存导入：解析+去重判定，不直接写流水
      responses:
        "200":
          description: 已创建暂存任务
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/ImportJob" }
    get:
      tags: [imports]
      operationId: listImportJobs
      responses:
        "200":
          description: 任务列表
  /api/v1/imports/jobs/upload:
    post:
      tags: [imports]
      operationId: uploadImportFile
      summary: 统一上传账单并自动识别来源（txt/csv/xlsx/pdf）
      description: >-
        未传 source 或传 auto 时按文件内容与表头识别微信、支付宝、银行，不依赖文件名。
        XLSX 最大 5MB，其他文件最大 20MB，最多 5000 条；ZIP 需先解压，不支持扫描 PDF。
        银行表格支持记账日期/交易日期、交易金额/发生额、余额等标准表头；PDF 支持文字版“日期 币种 金额 余额 摘要”。
        创建暂存任务，不直接写正式流水；当前账本需至少一个非归档账户。
      parameters:
        - { name: ledgerId, in: query, required: false, schema: { type: string }, description: 固定导入所属账本，缺省使用当前账本 }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                source: { type: string, enum: [auto, wechat, alipay, bank], default: auto, description: 兼容旧客户端的显式来源；与内容不一致返回 BILL_SOURCE_MISMATCH }
                file: { type: string, format: binary }
      responses:
        "200": { description: 已创建暂存任务 }
        "400": { description: 文件为空、格式未识别、来源不匹配、需解压/解密或未创建账户；error.code 和 message 给出原因 }
        "413": { description: multipart 文件超过 20MB，FILE_TOO_LARGE }
  /api/v1/imports/jobs/{id}:
    get:
      tags: [imports]
      operationId: getImportJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 任务详情+明细
  /api/v1/imports/items/{itemId}:
    patch:
      tags: [imports]
      operationId: decideImportItem
      summary: 逐条 accept/skip
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
  /api/v1/imports/jobs/{id}/commit:
    post:
      tags: [imports]
      operationId: commitImportJob
      summary: 批量提交 accept 明细为正式流水（事务化）
      responses:
        "200":
          description: 提交成功
  /api/v1/ledgers:
    get:
      tags: [families]
      operationId: listLedgers
  /api/v1/ledgers/switch:
    post:
      tags: [families]
      operationId: switchLedger
  /api/v1/families:
    get:
      tags: [families]
      operationId: listFamilies
    post:
      tags: [families]
      operationId: createFamily
      summary: 一键创建共享账本并切换为当前账本；原子作废创建者的其他待处理邀请
  /api/v1/families/{id}/members:
    post:
      tags: [families]
      operationId: addFamilyMember
      summary: 旧直接加人（已下线，统一 410 FAMILY_FLOW_REMOVED，请改用精确昵称邀请）
      responses:
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/families/{id}/members/{memberUserId}:
    delete:
      tags: [families]
      operationId: removeFamilyMember
    patch:
      tags: [families]
      operationId: changeFamilyMemberRole
      summary: 旧多级角色修改（已下线，统一 410 FAMILY_FLOW_REMOVED，仅保留 owner/member）
      responses:
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/families/{id}/invitations:
    post:
      tags: [families]
      operationId: createFamilyInvitation
      summary: Owner 按精确昵称邀请成员
  /api/v1/families/{id}/invitations/{inviteId}:
    delete:
      tags: [families]
      operationId: revokeFamilyInvitation
  /api/v1/families/invitations/pending:
    get:
      tags: [families]
      operationId: listPendingInvitations
      summary: 我的待处理邀请箱（App 启动/回前台/手动刷新拉取）
  /api/v1/families/invitations/{id}/accept:
    post:
      tags: [families]
      operationId: acceptFamilyInvitation
      summary: 接受邀请（单家庭约束 + 撤销其他待处理邀请）
  /api/v1/families/invitations/{id}/decline:
    post:
      tags: [families]
      operationId: declineFamilyInvitation
  /api/v1/families/{id}/exit:
    post:
      tags: [families]
      operationId: exitFamily
  /api/v1/families/{id}/transfer:
    post:
      tags: [families]
      operationId: transferFamilyOwnership
  /api/v1/families/{id}:
    delete:
      tags: [families]
      operationId: deleteFamily
    patch:
      tags: [families]
      operationId: updateFamily
  /api/v1/liabilities:
    get:
      tags: [loans]
      operationId: getLiabilities
  /api/v1/loans:
    get:
      tags: [loans]
      operationId: listLoans
      responses:
        "200":
          description: 贷款列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Loan" } }
    post:
      tags: [loans]
      operationId: createLoan
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, type, principal, termMonths, startDate]
              properties:
                name: { type: string }
                type: { type: string, enum: [car, mortgage, other] }
                currency: { type: string, default: CNY }
                principal: { type: integer }
                annualRate: { type: number }
                termMonths: { type: integer }
                startDate: { type: string, format: date }
                accountId: { type: string, description: 还款来源账户 }
                liabilityAccountId: { type: string, description: 已有 loan 类型负债账户（缺省自动创建） }
                ledgerId: { type: string }
      responses:
        "200":
          description: 创建成功（自动创建或绑定 loan 负债账户）
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/Loan" }
  /api/v1/loans/{id}:
    get:
      tags: [loans]
      operationId: getLoan
      responses:
        "200":
          description: 贷款详情 + 还款计划
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/Loan" }
                  schedule: { type: array, items: { $ref: "#/components/schemas/LoanPayment" } }
  /api/v1/loans/{id}/pay:
    post:
      tags: [loans]
      operationId: payLoan
      description: |
        贷款还款：以 (actor_user_id, loan_id, idempotency_key) 唯一索引做数据库级幂等。
        - 偿还下一期（不传 installmentId）必须提供 idempotencyKey，否则 400 IDEMPOTENCY_KEY_REQUIRED；
        - 显式还款应传 installmentId（避免不同 key 双击连续偿还下一期）；
        - 同一 key + 相同请求：第二次起返回完全相同结果且 replayed=true；
        - 同一 key + 不同期次/账户/日期：409 IDEMPOTENCY_KEY_REUSED。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payFromAccountId: { type: string }
                date: { type: string, format: date, description: 还款日期（缺省用当期到期日） }
                ledgerId: { type: string }
                installmentId: { type: string, description: 显式还款期次；显式还款应传此字段 }
                idempotencyKey: { type: string, maxLength: 64, description: 幂等键；偿还下一期必填（1-64 字符） }
      responses:
        "200":
          description: 还款成功：本金转账 + 利息支出两条流水，共用 paymentGroupId（重放时 replayed=true 且结果与首次一致）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  replayed: { type: boolean, description: 是否命中幂等重放 }
                  paidDate: { type: string, format: date }
                  installment: { type: integer }
                  installmentId: { type: string }
                  principalTransactionId: { type: string }
                  interestTransactionId: { type: string }
                  paymentGroupId: { type: string }
        "400":
          description: 偿还下一期未提供 idempotencyKey → IDEMPOTENCY_KEY_REQUIRED；贷款已还清 → LOAN_PAID_OFF
        "409":
          description: 该期已还款 → INSTALLMENT_ALREADY_PAID；同一 key 复用为不同请求 → IDEMPOTENCY_KEY_REUSED
  /api/v1/credit-cards/{accountId}/bills:
    post:
      tags: [loans]
      operationId: createCreditCardBill
  /api/v1/credit-card-bills:
    get:
      tags: [loans]
      operationId: listCreditCardBills
  /api/v1/credit-card-bills/{id}:
    patch:
      tags: [loans]
      operationId: markCreditCardBill
  /api/v1/credit-card-bills/{id}/pay:
    post:
      tags: [loans]
      operationId: payCreditCardBill
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [payFromAccountId]
              properties:
                payFromAccountId: { type: string }
                payDate: { type: string, format: date }
                ledgerId: { type: string }
      responses:
        "200":
          description: 还款成功并生成转账
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  transactionId: { type: string }
  /api/v1/audit-logs:
    get:
      tags: [audit]
      operationId: listAuditLogs
      summary: 账本内审计日志（可按 entityType/entityId 过滤）
      parameters:
        - { name: ledgerId, in: query, schema: { type: string }, required: false }
        - { name: entityType, in: query, schema: { type: string }, required: false }
        - { name: entityId, in: query, schema: { type: string }, required: false }
      responses:
        "200":
          description: 审计记录列表
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: 统一错误
      headers:
        x-request-id:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string }
        time: { type: string, format: date-time }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    AuthResponse:
      type: object
      description: complete-profile / 已有账号直接登录的返回
      required: [status, user, token, refreshToken]
      properties:
        status: { type: string, enum: [authenticated] }
        user: { $ref: "#/components/schemas/User" }
        token: { type: string }
        refreshToken: { type: string }
    LoginCodeResponse:
      type: object
      description: 验证码登录判别联合
      oneOf:
        - $ref: "#/components/schemas/AuthResponse"
        - type: object
          required: [status, onboardingToken, expiresAt]
          properties:
            status: { type: string, enum: [nickname_required] }
            onboardingToken: { type: string }
            expiresAt: { type: string, format: date-time }
    User:
      type: object
      description: 手机号仅在本人接口返回；他人视角不返回手机号
      required: [id, phone, nickname, createdAt]
      properties:
        id: { type: string, description: 内部不可变 UUID（JWT subject/关联/审计） }
        phone: { type: string, description: +86 E.164（仅本人接口可见） }
        nickname: { type: string, description: 公开昵称（共享账本邀请/成员展示） }
        nicknameChangeAvailableAt: { type: string, format: date-time, nullable: true }
        phoneMasked: { type: string, nullable: true, description: 脱敏手机号，仅本人资料接口返回 }
        createdAt: { type: string }
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string }
        password: { type: string }
        displayName: { type: string }
    Account:
      type: object
      required: [id, name, type, currency]
      properties:
        id: { type: string }
        ledgerId: { type: string, nullable: true }
        name: { type: string }
        type: { type: string }
        currency: { type: string }
        balance: { type: integer }
    Category:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
