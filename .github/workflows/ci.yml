name: CI

# 触发：主干推送 / PR / 手动（生产发布前跑一次全量验收）
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Release 构建/Archive 注入的 HTTPS API 地址；正式生产地址由仓库变量 PROD_API_BASE_URL 提供（禁止 localhost/example.com/占位域名）"
        required: false

# Release 构建/Archive 注入的 API 地址：正式生产域名只存在于**仓库变量** PROD_API_BASE_URL
# （Settings → Secrets and variables → Actions → Variables），不落在代码里，避免公开仓库暴露运维域名。
# 未设置该变量时，Release 构建会因域名守门校验而失败 —— 这是刻意的（禁止把占位域名打进产物）。
# 这里刻意不使用 localhost / example.com / your-* 等占位形式；
# ios/scripts/validate-api-url.sh 会拒绝占位值，Release 构建也会因此直接失败。
env:
  PROD_API_BASE_URL: ${{ inputs.api_base_url || vars.PROD_API_BASE_URL }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 改动范围判定（成本控制）：私有仓库的 **macOS runner 按 10 倍计费**，
  # 而每次 push 默认拉起 3 个 macOS job（联网版 ~7min + 离线版 ~6min + clean-tree ~4min
  # ≈ 170 计费分钟）。先用一个廉价的 ubuntu job 判断改了哪些目录，再决定是否启动重活：
  #   - 只改文档/README         → 仅跑卫生检查（省下整轮 macOS 额度）
  #   - 只改 backend/           → 不跑两个 iOS job
  #   - 只改 ios/ 或 ios-local/ → 只跑对应那一个 iOS job
  # scripts/** 与 .github/** 视为"共享改动"（脚本是 CI 自身的依赖），触发全部 job；
  # 手动 workflow_dispatch 强制全跑（发布前完整验证用）。
  changes:
    name: 改动范围判定
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      ios: ${{ steps.scope.outputs.ios }}
      ios_local: ${{ steps.scope.outputs.ios_local }}
      any_ios: ${{ steps.scope.outputs.any_ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发 → 全部 job 都跑"
            { echo "backend=true"; echo "ios=true"; echo "ios_local=true"; echo "any_ios=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse -q --verify HEAD~1 || true)"
          fi
          if [ -n "$base" ]; then
            files="$(git diff --name-only "$base" "$GITHUB_SHA" || true)"
          else
            files="$(git ls-files)"
          fi
          echo "改动文件："; printf '%s\n' "$files"
          shared=false
          if printf '%s\n' "$files" | grep -qE '^(scripts/|\.github/)'; then shared=true; fi
          backend=false
          if printf '%s\n' "$files" | grep -qE '^backend/'; then backend=true; fi
          ios=false
          if printf '%s\n' "$files" | grep -qE '^ios/'; then ios=true; fi
          ios_local=false
          if printf '%s\n' "$files" | grep -qE '^ios-local/'; then ios_local=true; fi
          if [ "$shared" = true ]; then backend=true; ios=true; ios_local=true; fi
          any_ios=false
          if [ "$ios" = true ] || [ "$ios_local" = true ]; then any_ios=true; fi
          { echo "backend=$backend"; echo "ios=$ios"; echo "ios_local=$ios_local"; echo "any_ios=$any_ios"; } >> "$GITHUB_OUTPUT"
          echo "→ backend=$backend ios=$ios ios_local=$ios_local any_ios=$any_ios"

  # ---------------------------------------------------------------- 仓库卫生
  hygiene:
    name: 仓库卫生（git diff --check / 无本地产物 / 无占位域名）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 空白字符检查（git diff --check）
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "检查 $base -> $GITHUB_SHA"
            git --no-pager diff --check "$base" "$GITHUB_SHA"
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then
            echo "基线不可用，退回检查最近一次提交"
            git --no-pager diff --check HEAD~1 HEAD
          else
            echo "仓库只有一个提交：检查工作区与索引"
            git --no-pager diff --check
            git --no-pager diff --check --cached
          fi

      - name: 凭证特征扫描（受跟踪文件 + 完整历史）
        run: |
          set -euo pipefail
          # 高置信度凭证特征（云厂商 AK / GitHub·Slack·OpenAI 令牌 / 私钥 / JWT）。
          # 同时扫**历史**：仓库改公开后历史同样可见，删掉文件并不算数。
          ./scripts/check-no-secrets.sh

      - name: shell 脚本语法检查（bash -n）
        run: |
          set -euo pipefail
          # 本机 macOS 自带 bash 3.2：脚本里若出现全角标点紧邻变量名等写法会被解析成非法变量名，
          # 只在运行时才炸（本项目已踩过一次：$VAR 后紧跟全角逗号 → unbound variable）。
          # 这里做纯语法体检，避免坏脚本进主干。
          status=0
          for f in scripts/*.sh; do
            if ! bash -n "$f"; then
              echo "::error::$f 语法检查失败"
              status=1
            fi
          done
          [ "$status" -eq 0 ] || exit 1
          echo "✅ 所有 shell 脚本语法检查通过"

      - name: 禁止跟踪 xcuserdata / 本地数据
        run: |
          set -euo pipefail
          hits="$(git ls-files | grep -E 'xcuserdata|\.xcuserstate|backend/data/|\.env$' || true)"
          if [ -n "$hits" ]; then
            echo "::error::以下本地产物不应进入 Git 索引："
            echo "$hits"
            exit 1
          fi
          echo "✅ Git 索引里没有 xcuserdata / .env / 本地数据"

      - name: 生产构建配置里禁止占位域名
        run: |
          set -euo pipefail
          if grep -rnI --exclude-dir=node_modules --exclude-dir=.git \
               -e 'your-production-domain' \
               -e 'example\.com' \
               ios/project.yml ios/Tally.xcodeproj/project.pbxproj \
               backend/docker-compose.caddy.yml backend/Caddyfile ios/Tally/Support/Info.plist; then
            echo "::error::发现占位 API 域名（example.com / your-production-domain）"
            exit 1
          fi
          echo "✅ 未发现占位 API 域名"

  # ---------------------------------------------------------------- 后端
  backend:
    name: 后端（typecheck/test/audit/build/dist/Docker）
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: test（全量集成测试）
        # 故意让宿主时区与业务时区不同，防止测试把 `new Date()` 的本地月份
        # 与 API 的 Asia/Shanghai 业务月份混用（尤其 UTC 月末 16:00 后）。
        env:
          TZ: UTC
          APP_TIMEZONE: Asia/Shanghai
        run: pnpm test

      - name: audit（生产依赖，high/critical 硬失败）
        run: |
          set -euo pipefail
          pnpm audit --audit-level=high --prod || {
            echo "::error::生产依赖存在 high/critical 漏洞，发布前必须处理（或明确豁免并记录）"
            pnpm audit --prod || true
            exit 1
          }

      - name: build（tsc -> dist）
        run: pnpm build

      - name: dist smoke（生产路径 xlsx 解析）
        run: node scripts/smoke-dist-xlsx.mjs

      - name: dist smoke（起服务 + /health/ready 探活）
        run: |
          set -euo pipefail
          JWT_SECRET="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')" \
          NODE_ENV=production PORT=18080 HOST=127.0.0.1 \
          DATABASE_URL=./data/ci-smoke.db LOG_LEVEL=off \
          node dist/index.js > /tmp/tally-dist.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/health/ready > /tmp/health.json; then
              cat /tmp/health.json; echo; echo "✅ dist 产物启动并通过 /health/ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::dist 启动探活失败"
          cat /tmp/tally-dist.log
          exit 1

      - name: Docker 镜像构建
        run: docker build -t tally-backend:ci .

      - name: docker compose 配置校验（docker-compose.caddy.yml）
        run: |
          set -euo pipefail
          export JWT_SECRET="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
          export TALLY_DOMAIN="tally.invalid"   # 仅用于渲染 compose 配置，非真实域名
          export ACME_EMAIL="ci@example.com"
          docker compose -f docker-compose.caddy.yml config --quiet
          docker compose -f docker-compose.caddy.yml config --format json > /tmp/rendered.json
          # 断言集中在仓库脚本里：本地（用已渲染的 JSON 也能跑）与 CI 共用同一实现
          node "$GITHUB_WORKSPACE/scripts/check-compose-topology.mjs" /tmp/rendered.json

      - name: 缺少必填变量时 compose 必须拒绝（防弱默认值上线）
        run: |
          set -euo pipefail
          if JWT_SECRET= TALLY_DOMAIN= ACME_EMAIL= docker compose -f docker-compose.caddy.yml config >/dev/null 2>&1; then
            echo "::error::缺少 JWT_SECRET/TALLY_DOMAIN/ACME_EMAIL 时 compose 竟然通过了校验"
            exit 1
          fi
          echo "✅ 缺少必填变量时 compose 按预期拒绝"

      # 生产认证模式必须由编排层显式钉住：AUTH_MODE=development 会把短信验证码明文回传，
      # 配合 NODE_ENV=production 可导致任意账号接管（backend/src/config.ts 另有一道启动期互锁）。
      - name: 生产 compose 必须钉住 AUTH_MODE=production
        run: |
          set -euo pipefail
          export JWT_SECRET="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
          export TALLY_DOMAIN="tally.invalid"   # 仅用于渲染 compose 配置，非真实域名
          export ACME_EMAIL="ci@example.com"
          for f in docker-compose.yml docker-compose.caddy.yml; do
            docker compose -f "$f" config --format json > "/tmp/rendered-$f.json"
            node "$GITHUB_WORKSPACE/scripts/check-compose-auth-mode.mjs" "/tmp/rendered-$f.json" "$f"
          done

      # 容器级回归：错误的认证模式组合必须让容器启动失败，而不是安静地明文回传验证码。
      - name: 容器拒绝 NODE_ENV=production + AUTH_MODE=development
        run: |
          set -euo pipefail
          if docker run --rm \
               -e NODE_ENV=production \
               -e AUTH_MODE=development \
               -e JWT_SECRET="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')" \
               tally-backend:ci > /tmp/badauthmode.log 2>&1; then
            echo "::error::生产容器竟然带着 AUTH_MODE=development 启动成功"
            cat /tmp/badauthmode.log
            exit 1
          fi
          grep -q "AUTH_MODE" /tmp/badauthmode.log \
            || { echo "::error::启动失败原因不是 AUTH_MODE 互锁"; cat /tmp/badauthmode.log; exit 1; }
          echo "✅ 生产容器按预期拒绝 development 认证模式"

      # 真实容器级回归：不只是 `compose config`，而是用完整 docker-compose.caddy.yml
      # 拉起 backend + Caddy，等待两者真正 healthy，并通过 HTTPS 反代访问 /health/ready。
      # - TALLY_DOMAIN=localhost：CI 无外部 DNS，Caddy 用内发自签证书，仍走真实 80/443 + TLS 反代。
      # - 复用 tally-backend:ci（上一构建步骤产物），避免重复构建镜像。
      # - caddy:2 镜像无 bash：healthcheck 用 busybox nc（见 compose 文件），本步骤同时回归它可真正变 healthy。
      - name: 真实容器级回归（完整 HTTPS 栈：双服务 healthy + HTTPS /health/ready）
        run: |
          set -euo pipefail
          export TALLY_DOMAIN=localhost
          export ACME_EMAIL=ci@example.com
          export JWT_SECRET="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
          docker tag tally-backend:ci tally-backend:latest
          cleanup() { docker compose -f docker-compose.caddy.yml down -v --remove-orphans >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker compose -f docker-compose.caddy.yml up -d --no-build
          ok=0
          for _ in $(seq 1 90); do
            b="$(docker inspect -f '{{.State.Health.Status}}' tally-backend 2>/dev/null || echo starting)"
            c="$(docker inspect -f '{{.State.Health.Status}}' tally-caddy 2>/dev/null || echo starting)"
            if [ "$b" = healthy ] && [ "$c" = healthy ]; then ok=1; break; fi
            if [ "$b" = unhealthy ] || [ "$c" = unhealthy ]; then
              echo "::error::服务进入 unhealthy（backend=$b caddy=$c）"
              docker compose -f docker-compose.caddy.yml ps
              docker logs tally-caddy --tail 80 2>&1 || true
              docker logs tally-backend --tail 80 2>&1 || true
              exit 1
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::error::等待超时，双服务未达 healthy"
            docker compose -f docker-compose.caddy.yml ps
            docker logs tally-caddy --tail 80 2>&1 || true
            exit 1
          fi
          node "$GITHUB_WORKSPACE/scripts/check-compose-live.mjs" "backend/docker-compose.caddy.yml"

  # ---------------------------------------------------------- 联网版 iOS 客户端
  ios-online:
    name: iOS 联网版（Debug + Release + 产物校验）
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      # macos-15 当前只预装 iOS 18.5+ 模拟器 runtime；Xcode 16.0 的 iOS 18.0 SDK
      # 虽仍在镜像中，但 actool 会因缺少匹配 runtime 在 CompileAssetCatalog 阶段失败。
      # 固定到同时具备 SDK 与 runtime 的 16.4，避免“Swift 已编译、资源目录最后失败”。
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Xcode / iOS runtime 配对检查
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes available | grep -q 'iOS 18.5'

      - name: Debug / Release 核心构建设置防回归
        working-directory: ${{ github.workspace }}
        run: ./scripts/check-ios-build-settings.sh ios/Tally.xcodeproj Tally

      - name: 发布资产检查（图标/版本号/Bundle ID/签名）
        working-directory: ${{ github.workspace }}
        run: ./scripts/check-ios-release-assets.sh ios Tally

      - name: 共享账本状态机单元测试
        run: |
          set -euo pipefail
          xcodebuild -project Tally.xcodeproj -scheme Tally \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/dd-test" \
            -resultBundlePath "$RUNNER_TEMP/tally-test.xcresult" \
            test CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/tally-test.log
          grep -q "\*\* TEST SUCCEEDED \*\*" /tmp/tally-test.log

      - name: Debug 构建（允许本机 HTTP 联调）
        run: |
          set -euo pipefail
          xcodebuild -project Tally.xcodeproj -scheme Tally \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/dd-debug" \
            build CODE_SIGNING_ALLOWED=NO

      - name: Release 构建（显式注入正式生产域名，取自仓库变量 PROD_API_BASE_URL）
        run: |
          set -euo pipefail
          echo "注入正式生产 API 地址：$PROD_API_BASE_URL"
          xcodebuild -project Tally.xcodeproj -scheme Tally \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/dd-release" \
            build CODE_SIGNING_ALLOWED=NO \
            TALLY_API_BASE_URL="$PROD_API_BASE_URL"

      - name: 校验 Release 产物 Info.plist 是非占位 HTTPS 地址
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/dd-release/Build/Products" -maxdepth 2 -name 'Tally.app' -print -quit)"
          test -n "$APP" || { echo "::error::找不到 Release 产物 Tally.app"; exit 1; }
          plutil -extract TallyAPIBaseURL raw -o - "$APP/Info.plist"
          # 校验 TallyAPIBaseURL + 扫描产物 Info.plist 里出现的每一个 URL
          "$GITHUB_WORKSPACE/ios/scripts/validate-api-url.sh" --plist "$APP"
          # 二进制层面兜底：Release 包里不允许出现任何明文 http 地址
          # （APIClient 自身的“占位域名黑名单”字面量含 example.com 是刻意的运行时守门代码，
          #  不属于泄漏，因此这里只查明文 http 地址）
          if grep -a -E 'http://(localhost|127\.[0-9]+\.[0-9]+\.[0-9]+|0\.0\.0\.0)' "$APP/Tally" > /dev/null 2>&1; then
            echo "::error::Release 二进制里残留明文 http 地址"
            grep -a -o -E 'http://[^" ]{0,40}' "$APP/Tally" | sort -u | head
            exit 1
          fi
          echo "✅ Release 产物 API 地址合规：$PROD_API_BASE_URL"

      - name: 无效 URL 时 Release 构建必须失败（守门人回归）
        run: |
          set -uo pipefail
          if xcodebuild -project Tally.xcodeproj -scheme Tally \
               -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
               -configuration Release -derivedDataPath "$RUNNER_TEMP/dd-bad" \
               build CODE_SIGNING_ALLOWED=NO TALLY_API_BASE_URL="https://api.example.com" \
               > /tmp/bad-release.log 2>&1; then
            echo "::error::占位地址竟然构建成功，构建期校验失效"
            tail -50 /tmp/bad-release.log
            exit 1
          fi
          grep -q 'API 地址不合规' /tmp/bad-release.log \
            || { echo "::error::构建失败原因不是域名校验"; tail -50 /tmp/bad-release.log; exit 1; }
          echo "✅ 占位/无效地址被构建期直接拒绝"

      - name: Archive（版本号 / 发布资产，主干或手动触发时）
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          xcodebuild -project Tally.xcodeproj -scheme Tally \
            -destination 'generic/platform=iOS' -configuration Release \
            -archivePath "$RUNNER_TEMP/Tally.xcarchive" \
            -allowProvisioningUpdates \
            archive CODE_SIGNING_ALLOWED=NO \
            TALLY_API_BASE_URL="$PROD_API_BASE_URL"
          APP="$RUNNER_TEMP/Tally.xcarchive/Products/Applications/Tally.app"
          test -d "$APP"
          echo "版本号: $(plutil -extract CFBundleShortVersionString raw -o - "$APP/Info.plist")" \
            "build $(plutil -extract CFBundleVersion raw -o - "$APP/Info.plist")"
          plutil -extract TallyAPIBaseURL raw -o - "$APP/Info.plist"

  # --------------------------------------------------------- 离线版 iOS 客户端
  ios-local:
    name: iOS 离线版（build + 全量测试）
    needs: changes
    if: needs.changes.outputs.ios_local == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-local
    steps:
      - uses: actions/checkout@v4
      # 与联网版保持同一 Xcode/runtime 配对；不要回退到缺少 iOS 18.0 runtime 的 16.0。
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Xcode / iOS runtime 配对检查
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes available | grep -q 'iOS 18.5'

      - name: 发布资产检查（1024 AppIcon / 版本号 / 签名）
        working-directory: ${{ github.workspace }}
        run: ./scripts/check-ios-release-assets.sh ios-local Tally

      - name: 真机 target 构建（iphoneos / Release，CI 免签模式）
        run: |
          set -euo pipefail
          xcodebuild -project TallyLocal.xcodeproj -scheme Tally \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/dd-device" \
            build CODE_SIGNING_ALLOWED=NO

      - name: 全量测试（Swift Testing 单测 + UI 测试）
        run: |
          set -euo pipefail
          xcodebuild -project TallyLocal.xcodeproj -scheme Tally \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/dd-test" \
            -resultBundlePath "$RUNNER_TEMP/ioslocal-test.xcresult" \
            -allowProvisioningUpdates test 2>&1 | tee /tmp/ioslocal-test.log
          grep -E "Test run with [0-9]+ tests .* passed|Test Suite 'All tests' passed" /tmp/ioslocal-test.log | tail -3
          grep -q "\*\* TEST SUCCEEDED \*\*" /tmp/ioslocal-test.log

      - name: Archive（离线版发布包，主干或手动触发时）
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          xcodebuild -project TallyLocal.xcodeproj -scheme Tally \
            -destination 'generic/platform=iOS' -configuration Release \
            -archivePath "$RUNNER_TEMP/TallyLocal.xcarchive" \
            -allowProvisioningUpdates archive CODE_SIGNING_ALLOWED=NO
          test -d "$RUNNER_TEMP/TallyLocal.xcarchive/Products/Applications/Tally.app"

      - name: 上传测试结果（失败时便于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-local-test-results
          path: ${{ runner.temp }}/ioslocal-test.xcresult

  # ------------------------------------------------- 构建/测试后工作区仍需干净
  clean-tree:
    name: 构建后 git status 必须干净
    needs: [changes, ios-online, ios-local]
    # 只有 iOS 侧确实构建过（且没失败）时才需要验证"构建没污染工作区"；
    # 任一 iOS job 被范围判定跳过或失败，这一步就没有意义（always() 保证 needs 被跳过时仍能求值）。
    if: >-
      always() && needs.changes.outputs.any_ios == 'true' &&
      needs.ios-online.result != 'failure' && needs.ios-local.result != 'failure'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 复现关键构建并确认无生成物泄漏进 Git
        run: |
          set -euo pipefail
          xcodebuild -project ios/Tally.xcodeproj -scheme Tally \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/dd-clean" \
            build CODE_SIGNING_ALLOWED=NO TALLY_API_BASE_URL="$PROD_API_BASE_URL" >/dev/null
          xcodebuild -project ios-local/TallyLocal.xcodeproj -scheme Tally \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/dd-clean2" \
            build CODE_SIGNING_ALLOWED=NO >/dev/null
          git status --porcelain=v1
          if [ -n "$(git status --porcelain=v1)" ]; then
            echo "::error::构建产生了受版本控制文件的改动（检查 xcuserdata / 生成物是否已忽略）"
            exit 1
          fi
          echo "✅ 构建后 git status 干净"
